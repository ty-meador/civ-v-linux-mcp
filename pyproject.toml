[project]
name = "civ-v-llm-harness"
version = "1.5.0"
description = "MCP server + harness letting an LLM play Sid Meier's Civilization V (Linux) via the FireTuner Lua socket"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.2", "fastapi>=0.110", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
# The injected Lua ships with the package: the runtime fragments (harness/runtime_source.py MANIFEST), the
# GenericPopup shim and audit.lua.
harness = ["lua/*.lua", "lua/runtime/*.lua"]

[dependency-groups]
# The regression suite: lupa / liblua5.4 run the shipped Lua (harness/lua/runtime/) against fake game objects.
dev = ["pytest>=8", "lupa>=2.2"]

[tool.pytest.ini_options]
# `harness` imports resolve from a bare `pytest` too, not only `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
