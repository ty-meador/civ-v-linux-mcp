[project]
name = "civ-v-llm-harness"
version = "1.13.0"
description = "MCP server + harness letting an LLM play Sid Meier's Civilization V (Linux) via the FireTuner Lua socket"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.2"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
# The injected Lua ships with the package: the runtime fragments (harness/runtime_source.py MANIFEST), the
# GenericPopup shim and audit.lua.
harness = ["lua/*.lua", "lua/runtime/*.lua"]

[dependency-groups]
# The regression suite: lupa / liblua5.4 run the shipped Lua (harness/lua/runtime/) against fake game objects;
# ruff lints the Python (scripts/check.sh runs it first).
dev = [
    "pytest>=8",
    "lupa>=2.2",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
# `harness` imports resolve from a bare `pytest` too, not only `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Bugs, not style: pyflakes (F), bugbear (B), warnings (W), import and syntax errors (E4, E9). The layout rules
# (E5 line length, E7 one-line guards and semicolons, lambda assignment) stay off: the code is deliberately dense.
select = ["E4", "E9", "F", "B", "W",
          "RUF100", "RUF059", "SIM115", "PLW1510", "RET503", "RUF034", "RUF015"]  # stale noqa, unread unpacked names, unclosed files, unchecked subprocess.run, a fall-through return, dead if-else, [0] on a comprehension
ignore = ["B905"]  # zip(strict=) on every zip is noise; the few zips here pair rows of the same length
